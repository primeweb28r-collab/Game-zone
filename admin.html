<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>GameZone Admin</title>
<style>
:root{--bg:#070908;--sf:#0d110f;--ln:#2a322c;--tx:#f3f5f1;--mu:#a3ada5;--g:#9df52b}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px;max-width:760px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:10px;width:100%;margin:4px 0 10px}
button{background:var(--g);color:#071006;font-weight:700;border:0;cursor:pointer;width:auto;padding:10px 16px}button.o{background:none;color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:#ff6b6b;border:1px solid #6b3030}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin:12px 0}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}label{display:block;color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g)}#msg{color:var(--g);min-height:1.4em}
</style></head><body>
<h1>GameZone Admin</h1><p id="msg" role="status"></p>
<div id="lg" class="pn"><form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></div>
<div id="ap" hidden>
 <div class="pn"><div class="row"><h2 style="flex:3;margin:0">Games</h2><button id="nw" class="o">+ New game</button><button id="so" class="o">Sign out</button></div><div id="gl"></div></div>
 <form id="gf" class="pn"><h2 id="gt" style="margin-top:0">New game</h2>
  <div class="row"><label>Title<input id="title" required></label><label>Slug (URL name)<input id="slug" required></label></div>
  <div class="row"><label>Category<input id="category"></label><label>Developer<input id="developer"></label></div>
  <div class="row"><label>Price<input id="price" type="number" min="0" step="0.01" value="0"></label><label>Currency<select id="currency"><option>USD</option><option>TZS</option></select></label><label>Discount %<input id="salePct" type="number" min="0" max="100" value="0"></label></div>
  <div class="row"><label>Age<select id="age"><option value="E">Everyone</option><option value="T" selected>Teen</option><option value="M">Mature 17+</option></select></label><label>Review score (0 = none)<input id="score" type="number" min="0" max="10" step="0.1" value="0"></label><label>Status<select id="status"><option>draft</option><option>published</option><option>retired</option></select></label></div>
  <label>Cover image link (https://)<input id="coverUrl" type="url"></label><label>Official website (https://)<input id="officialUrl" type="url"></label>
  <label>Description<textarea id="description" rows="4"></textarea></label>
  <label style="display:flex;gap:8px;align-items:flex-start"><input id="rights" type="checkbox" style="width:auto;margin-top:4px"> I own this game or hold written permission to sell and distribute it.</label>
  <div class="row"><button>Save game</button><button type="button" id="dl" class="d" hidden>Delete game</button></div></form>
 <div id="fp" class="pn" hidden><h2 style="margin-top:0">Game files</h2><div id="fl"></div>
  <label>Version (optional)<input id="ver" placeholder="e.g. 1.0.2"></label><label>Choose the game file<input id="ff" type="file"></label>
  <button id="up">Upload file</button><div class="bar" hidden id="pb"><i></i></div><p class="mu" id="pt">Keep this page open while uploading. Big files take a while.</p></div>
</div>
<script>
const $=s=>document.querySelector(s);let T=sessionStorage.getItem('gz-adm')||'',games=[],cur=null;
const say=m=>$('#msg').textContent=m||'';
async function api(p,o={}){const r=await fetch(p,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(T&&{Authorization:'Bearer '+T})},body:o.body&&JSON.stringify(o.body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error((d.errors&&d.errors.join('. '))||d.error||'Request failed');return d}
const F=['title','slug','category','developer','currency','salePct','age','score','status','coverUrl','officialUrl','description'];
const size=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';
function show(){const on=!!T;$('#lg').hidden=on;$('#ap').hidden=!on;if(on)load()}
$('#lf').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:{email:$('#em').value,password:$('#pw').value}});if(d.user.role!=='admin')throw new Error('This account is not an admin');T=d.token;sessionStorage.setItem('gz-adm',T);say('');show()}catch(x){say(x.message)}};
$('#so').onclick=()=>{T='';sessionStorage.removeItem('gz-adm');show()};
async function load(){try{games=(await api('/api/admin/games')).games;const l=$('#gl');l.textContent='';games.forEach(g=>{const b=document.createElement('button');b.className='o';b.style.cssText='display:block;width:100%;text-align:left';b.textContent=`${g.title}  ·  ${g.status}  ·  ${g.fileCount} file(s)`;b.onclick=()=>pick(g);l.append(b)});if(cur)pick(games.find(g=>g.id==cur.id)||null)}catch(x){say(x.message);if(/expired|required/i.test(x.message))$('#so').click()}}
function pick(g){cur=g;say('');$('#gt').textContent=g?'Edit: '+g.title:'New game';F.forEach(k=>$('#'+k).value=g?g[k]??'':({currency:'USD',age:'T',status:'draft',salePct:0,score:0})[k]??'');$('#price').value=g?g.priceCents/100:0;$('#rights').checked=!!(g&&g.rightsConfirmed);$('#slug').readOnly=!!(g&&g.status==='published');$('#dl').hidden=!g;$('#fp').hidden=!g;if(g)files()}
$('#nw').onclick=()=>pick(null);
$('#gf').onsubmit=async e=>{e.preventDefault();const b={};F.forEach(k=>b[k]=$('#'+k).value);b.salePct=parseInt(b.salePct)||0;b.score=parseFloat(b.score)||0;b.priceCents=Math.round(parseFloat($('#price').value||0)*100);b.rightsConfirmed=$('#rights').checked;b.screenshots=cur?cur.screenshots:[];b.videos=cur?cur.videos:[];
 try{if(cur)await api('/api/admin/games/'+cur.id,{method:'PUT',body:b});else{cur={id:(await api('/api/admin/games',{method:'POST',body:{...b,status:'draft'}})).id}}say('Saved');await load()}catch(x){say(x.message)}};
$('#dl').onclick=async()=>{if(!confirm('Delete this game and its files?'))return;try{await api('/api/admin/games/'+cur.id,{method:'DELETE'});cur=null;pick(null);load()}catch(x){say(x.message)}};
async function files(){const l=$('#fl');try{const f=(await api(`/api/admin/games/${cur.id}/files`)).files;l.textContent='';if(!f.length)l.textContent='No files yet.';f.forEach(x=>{const r=document.createElement('div');r.className='row';const t=document.createElement('span');t.textContent=`${x.filename} (${size(x.size_bytes)}) ${x.version||''} · ${x.status}`;const d=document.createElement('button');d.className='d';d.textContent='Delete';d.onclick=async()=>{if(!confirm('Delete this file?'))return;try{await api('/api/admin/files/'+x.id,{method:x.status==='ready'?'DELETE':'POST'});files();load()}catch(e){say(e.message)}};r.append(t,d);l.append(r)})}catch(x){say(x.message)}}
async function upload(file){const st=await api(`/api/admin/games/${cur.id}/files/start`,{method:'POST',body:{filename:file.name,size:file.size,version:$('#ver').value}});
 const {fileId,partSize,totalParts}=st,parts=[];let done=0,next=1,fail=null;const bar=$('#pb');bar.hidden=false;
 const work=async()=>{while(next<=totalParts&&!fail){const n=next++,blob=file.slice((n-1)*partSize,Math.min(n*partSize,file.size));
  for(let a=1;;a++){try{const {urls}=await api(`/api/admin/files/${fileId}/part-urls`,{method:'POST',body:{partNumbers:[n]}});const r=await fetch(urls[n],{method:'PUT',body:blob});if(!r.ok)throw new Error('Part '+n+' failed ('+r.status+')');const et=r.headers.get('ETag');if(!et)throw new Error('Storage sent no ETag. Check the bucket CORS settings (see README).');parts.push({partNumber:n,etag:et});break}
   catch(e){if(a>=4||/ETag/.test(e.message)){fail=e instanceof TypeError?new Error('Could not reach storage. Check the bucket CORS settings (see README).'):e;return}await new Promise(r=>setTimeout(r,1500*a))}}
  done++;bar.firstChild.style.width=(done/totalParts*100)+'%';$('#pt').textContent=`Uploading… ${Math.round(done/totalParts*100)}% (${done}/${totalParts} parts). Keep this page open.`}};
 await Promise.all([work(),work(),work()]);
 if(fail){await api(`/api/admin/files/${fileId}/abort`,{method:'POST'}).catch(()=>{});throw fail}
 await api(`/api/admin/files/${fileId}/complete`,{method:'POST',body:{parts}})}
$('#up').onclick=async()=>{const f=$('#ff').files[0];if(!f)return say('Choose a file first');$('#up').disabled=true;say('');try{await upload(f);say('Upload finished');$('#ff').value=''}catch(x){say(x.message)}$('#up').disabled=false;$('#pt').textContent='Keep this page open while uploading. Big files take a while.';$('#pb').hidden=true;files();load()};
show();
</script></body></html>
